<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f4a37" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0e12" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Hexagon: a network/node motif, tying to the VLAN/topology work on the site -->
  <path d="M50 4 L91 27 L91 73 L50 96 L9 73 L9 27 Z"
        fill="url(#hexFill)" stroke="#34d399" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Terminal prompt ">_" -->
  <path d="M34 38 L50 50 L34 62" fill="none" stroke="#34d399" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56" y1="64" x2="72" y2="64" stroke="#34d399" stroke-width="6.5" stroke-linecap="round"/>
</svg>
